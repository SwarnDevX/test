packages:
  - "apps/*"
  - "packages/*"

# Overrides ensure React 19 and matching @types are used across all packages.
# pnpm 9+ reads overrides from pnpm-workspace.yaml, not package.json.
overrides:
  react: "^19.2.6"
  react-dom: "^19.2.6"
  "@types/react": "^19.1.5"
  "@types/react-dom": "^19.1.3"
  # Pin viem to avoid viem@2.51.x which pulls in a pkg.pr.new (PR preview)
  # version of ox that fails behind corporate SSL proxies.
  viem: "2.31.3"
