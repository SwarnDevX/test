apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-worker
  namespace: codecrafter
  labels:
    app: judge-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: judge-worker
  template:
    metadata:
      labels:
        app: judge-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      # Workers need Docker socket to spawn sandbox containers.
      # In production, prefer a DinD sidecar or Kata Containers + containerd.
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: seccomp-profile
          configMap:
            name: judge-seccomp
      containers:
        - name: judge-worker
          image: ghcr.io/swarndevx/codecrafter-judge-worker:latest
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: seccomp-profile
              mountPath: /app/profiles
          envFrom:
            - configMapRef:
                name: codecrafter-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codecrafter-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codecrafter-secrets
                  key: RABBITMQ_PASSWORD
            - name: JUDGE_SECCOMP_PROFILE
              value: /app/profiles/judge.json
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 30
---
# HPA scales judge workers based on RabbitMQ queue depth via KEDA (if installed)
# or CPU as a proxy metric.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: judge-worker-hpa
  namespace: codecrafter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: judge-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
