global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'codecrafter-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'codecrafter-judge-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['judge-worker:8081']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
