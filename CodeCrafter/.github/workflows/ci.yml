name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & unit-test (skip integration tests)
        run: mvn -B verify -Dsurefire.excludedGroups=integration --no-transfer-progress
        # Integration tests run against real Postgres/Redis/RabbitMQ via Testcontainers.
        # They are in a separate job below.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/
            judge-worker/target/surefire-reports/

  # ── Backend integration tests (Testcontainers) ────────────────────────────
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push'   # Only on push, not every PR

    services:
      # Testcontainers manages its own containers, no need for service containers here

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run integration tests (Testcontainers)
        run: mvn -B verify -Dsurefire.groups=integration --no-transfer-progress
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js 14 / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Type check
        run: cd web && npm run type-check

      - name: Lint
        run: cd web && npm run lint

      - name: Build
        run: cd web && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-at-least-32-chars-long
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          GITHUB_CLIENT_ID: placeholder
          GITHUB_CLIENT_SECRET: placeholder

  # ── Docker image build check ───────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: codecrafter/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build judge-worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/judge-worker.Dockerfile
          push: false
          tags: codecrafter/judge-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: codecrafter/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
