name: CD — Build & Push Images

on:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release push

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Build & push Docker images ────────────────────────────────────────────
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: infra/docker/backend.Dockerfile
            image: codecrafter-api
          - service: judge-worker
            dockerfile: infra/docker/judge-worker.Dockerfile
            image: codecrafter-judge-worker
          - service: web
            dockerfile: infra/docker/web.Dockerfile
            image: codecrafter-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

  # ── Deploy to Kubernetes (requires KUBECONFIG secret) ────────────────────
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply manifests
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/configmap.yaml
          kubectl apply -f infra/k8s/postgres.yaml
          kubectl apply -f infra/k8s/redis.yaml
          kubectl apply -f infra/k8s/rabbitmq.yaml
          kubectl apply -f infra/k8s/api.yaml
          kubectl apply -f infra/k8s/judge-worker.yaml
          kubectl apply -f infra/k8s/web.yaml
          kubectl apply -f infra/k8s/ingress.yaml
          kubectl apply -f infra/k8s/network-policies.yaml

      - name: Rolling restart (pick up new image tags)
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | head -c 7)"
          kubectl -n codecrafter set image deployment/api     api=ghcr.io/${{ github.repository_owner }}/codecrafter-api:${SHA_TAG}
          kubectl -n codecrafter set image deployment/judge-worker judge-worker=ghcr.io/${{ github.repository_owner }}/codecrafter-judge-worker:${SHA_TAG}
          kubectl -n codecrafter set image deployment/web     web=ghcr.io/${{ github.repository_owner }}/codecrafter-web:${SHA_TAG}

      - name: Wait for rollout
        run: |
          kubectl -n codecrafter rollout status deployment/api          --timeout=180s
          kubectl -n codecrafter rollout status deployment/judge-worker --timeout=180s
          kubectl -n codecrafter rollout status deployment/web          --timeout=120s

  # ── Run k6 smoke test post-deploy ─────────────────────────────────────────
  smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run k6 smoke (browse)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: infra/loadtest/browse.js
          flags: --vus 10 --duration 30s
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
