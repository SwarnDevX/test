spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  # RabbitMQ is not used in auth integration tests — disable listener
  rabbitmq:
    listener:
      simple:
        auto-startup: false

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret
            scope: openid,email,profile
          github:
            client-id: test-github-id
            client-secret: test-github-secret
            scope: read:user,user:email

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-chars-long!
    access-expiry-minutes: 15
    refresh-expiry-days: 7
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket:
      avatars: cc-avatars
      editorials: cc-editorials
      submissions: cc-submissions
  frontend-url: http://localhost:3000
