server:
  port: 8080

spring:
  application:
    name: codecrafter-api

  threads:
    virtual:
      enabled: true   # Java 21 virtual threads for Tomcat/async tasks

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codecrafter}
    username: ${SPRING_DATASOURCE_USERNAME:cc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cc_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      pool-name: CodeCrafterPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:cc_redis_pass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          min-idle: 2
          max-wait: 1000ms

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:cc_rabbit}
    password: ${SPRING_RABBITMQ_PASSWORD:cc_rabbit_pass}
    virtual-host: /
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: manual

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope: read:user,user:email

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

app:
  jwt:
    secret: ${JWT_SECRET:changeme_in_production_use_at_least_32_random_chars}
    access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:cc_minio_access}
    secret-key: ${MINIO_SECRET_KEY:cc_minio_secret}
    bucket:
      avatars: cc-avatars
      editorials: cc-editorials
      submissions: cc-submissions
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  rate-limit:
    submissions-per-minute: 5
    runs-per-minute: 30
    reads-per-minute-authenticated: 100
    reads-per-minute-anonymous: 30
  rabbitmq:
    submission-queue: submissions.queue
    submission-exchange: submissions.exchange
    submission-routing-key: submission

logging:
  level:
    dev.codecrafter: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
